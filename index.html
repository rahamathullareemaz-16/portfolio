<!DOCTYPE html>
<html>
<head>
<title>Reemaz Portfolio</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background: radial-gradient(circle at top,#0f172a,#020617);
  color:white;
  overflow-x:hidden;
}

/* NAV */
nav{
  display:flex;
  justify-content:center;
  gap:40px;
  padding:20px;
  background:rgba(15,23,42,0.8);
  backdrop-filter:blur(10px);
}
nav a{
  color:#38bdf8;
  text-decoration:none;
  font-weight:bold;
}

/* HERO */
.hero{
  text-align:center;
  padding:80px 20px;
  animation:fadeIn 2s;
}

.hero img{
  width:180px;
  border-radius:50%;
  box-shadow:0 0 30px #38bdf8;
  transition:0.5s;
}
.hero img:hover{
  transform:scale(1.1);
}

h1{
  font-size:40px;
  margin-top:20px;
}

/* typing */
.typing{
  color:#38bdf8;
  font-size:20px;
  margin:10px 0;
}

/* BUTTON */
.btn{
  display:inline-block;
  margin-top:15px;
  padding:10px 25px;
  background:#38bdf8;
  color:black;
  border-radius:8px;
  text-decoration:none;
  transition:0.3s;
}
.btn:hover{
  background:#0ea5e9;
  transform:scale(1.05);
}

/* ACHIEVEMENTS */
.section{
  padding:50px;
  text-align:center;
}

.cards{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:20px;
}

/* glass cards */
.card{
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:15px;
  width:250px;
  backdrop-filter:blur(10px);
  transition:0.4s;
}
.card:hover{
  transform:translateY(-10px);
  box-shadow:0 0 20px #38bdf8;
}

/* animation */
.hidden{
  opacity:0;
  transform:translateY(40px);
  transition:1s;
}
.show{
  opacity:1;
  transform:translateY(0);
}

@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}
</style>

</head>

<body>

<!-- NAV -->
<nav>
  <a href="index.html">Home</a>
  <a href="projects.html">Projects</a>
</nav>

<!-- HERO -->
<div class="hero">
  <img src="profile.jpg">

  <h1>RAHAMATHULLA REEMAZ H</h1>

  <p class="typing" id="typing"></p>

  <a class="btn" href="resume.pdf">View Resume</a>
</div>

<!-- ACHIEVEMENTS -->
<div class="section hidden">
  <h2>Achievements</h2>

  <div class="cards">
    <div class="card">IEEE Member</div>
    <div class="card">Vice Chair – IEEE SPS</div>
    <div class="card">IEEE Ambassador</div>
    <div class="card">IEEE Conference Ambassador</div>
    <div class="card">Membership Development Team</div>
  </div>
</div>

<script>

/* typing animation */
const text = ["Embedded Developer","IoT Enthusiast","AI Learner"];
let i=0,j=0,current="",isDeleting=false;

function type(){
  if(i<text.length){
    if(!isDeleting && j<=text[i].length){
      current=text[i].substring(0,j++);
    }
    else if(isDeleting && j>=0){
      current=text[i].substring(0,j--);
    }

    if(j==text[i].length) isDeleting=true;
    if(j==0){ isDeleting=false; i++; }

    document.getElementById("typing").innerHTML=current;
  }
  setTimeout(type,120);
}
type();

/* scroll animation */
const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.classList.add("show");
}
});
});

document.querySelectorAll(".hidden").forEach(el=>observer.observe(el));

</script>

</body>
</html>
